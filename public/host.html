<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Host Console · AMQ Tours Gatcha</title>
    <link rel="icon" href="amq-tours-logo.png" type="image/png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="host-tools.css" />
    <script type="module" src="host.js"></script>
  </head>
  <body>
    <main class="host-shell">
      <header class="host-header">
        <div>
          <span class="eyebrow">AMQ TOURS / HOST TOOLS</span>
          <h1 class="space-top">Gacha Host Console</h1>
        </div>
        <a class="button secondary" href="./">Player Site ↗</a>
      </header>
      <div
        id="result"
        class="host-result"
        role="status"
        aria-live="polite"
      ></div>
      <section id="unlock" class="host-panel">
        <h2>Host Console Sign In</h2>
        <p>
          Sign in with your Host or Quiz Maker account.
        </p>
        <form id="admin-login-form" class="stack">
          <label
            >AMQ player ID or alias<input
              name="player"
              required
              maxlength="100"
              autocomplete="username"
          /></label>
          <label
            >Password<input
              type="password"
              name="password"
              required
              minlength="8"
              maxlength="256"
              autocomplete="current-password"
          /></label>
          <button class="button" type="submit">
            Sign in to host console →
          </button>
        </form>
        <p class="form-hint">Hosts can grant Quiz Maker access in Players &amp; Access.</p>
      </section>
      <section id="console" hidden>
        <aside class="host-toolbar">
          <label class="host-mobile-section">Workspace<select id="host-section"></select></label>
          <nav class="host-tabs" aria-label="Host tools">
            <div><h2>Tour Operations</h2>
              <button data-tab="rewards" class="active">Credit Rewards</button>
              <button data-tab="pickems">Pick’ems</button>
            </div>
            <div><h2>Content &amp; Review</h2>
              <button data-tab="catalog">Catalogue &amp; Prices</button>
              <button data-tab="quiz">Quiz</button>
              <button data-tab="play-review">Match Review</button>
            </div>
            <div><h2>Administration</h2>
              <button data-tab="players">Players &amp; Access</button>
              <button data-tab="credit-audit">Credit Audit</button>
              <button data-tab="activity">Activity</button>
              <button data-tab="resets">Reset Tools</button>
            </div>
          </nav>
          <button class="text-button" id="lock">Lock Console</button>
        </aside>
        <div id="host-content"></div>
      </section>
    </main>
  </body>
</html>
