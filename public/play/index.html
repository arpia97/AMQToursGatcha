<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101117">
    <meta name="description" content="Play AMQ Tours. Find live matches and join AMQ Tours Play matchmaking.">
    <title>Play · AMQ Tours</title>
    <link rel="icon" href="amq-tours-logo.png" type="image/png">
    <link rel="stylesheet" href="styles.css?v=player-flags">
    <link rel="stylesheet" href="features.css">
    <link rel="stylesheet" href="card-frames.css">
    <link rel="stylesheet" href="inbox.css?v=notification-mute">
    <link rel="stylesheet" href="play/play.css?v=amq-registration">
    <link rel="stylesheet" href="wordmark.css">
    <link rel="stylesheet" href="quiz-result.css?v=quiz-mode-toggles" />
    <link rel="stylesheet" href="quiz-player.css?v=song-type" />
    <script type="module" src="play/app.js?v=song-type"></script>
  <link rel="stylesheet" href="weekly-streak.css">
  </head>
  <body class="play-site">
    <aside class="play-sidebar">
      <a class="play-brand amq-wordmark" href="/play/" aria-label="AMQ Tours Play home"><img src="amq-tours-logo.png" width="43" height="43" alt=""><span>AMQ TOURS<small>PLAY</small></span></a>
      <a class="button secondary play-gacha-link" href="/gacha/">Gacha <span aria-hidden="true">↗</span></a>
      <span class="play-nav-label">Game Modes</span>
      <nav id="play-nav" aria-label="Game Modes"></nav>
      <div class="play-crosslinks"><a href="/play/host" data-play-mode="host" data-host-page hidden>Host Console</a><a href="/tour/profile">Tour Platform <span>↗</span></a></div>
    </aside>
    <div class="play-workspace">
      <header class="play-header">
        <a class="play-mobile-brand amq-wordmark amq-wordmark--compact" href="/play/" aria-label="AMQ Tours Play home"><img src="amq-tours-logo.png" width="26" height="26" alt=""><span>AMQ TOURS<small>PLAY</small></span></a>
        <span class="play-header-label">AMQ TOURS <span>/</span> PLAY</span>
        <div class="play-header-actions">
          <div id="play-current-queue" hidden>
            <button type="button" data-action="view-queue" title="View matchmaking"><strong id="play-queue-mode"></strong><small id="play-queue-status" role="status"></small></button>
            <button type="button" data-action="leave-queue" aria-label="Leave queue" title="Leave queue">×</button>
          </div>
          <div id="play-account" class="top-actions">
            <div class="inbox-anchor" hidden>
              <a class="inbox-bell" aria-label="Notifications"><svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 6-3 7-3 9h18c0-2-3-3-3-9ZM10 21h4"/></svg><b class="inbox-bell-count" hidden></b></a>
              <section class="inbox-pop" aria-labelledby="inbox-pop-title" id="inbox-pop" hidden>
                <header><h2 id="inbox-pop-title">Notifications</h2><button type="button" class="text-button" data-action="inbox-read" disabled>Mark all as read</button></header>
                <div class="inbox-pop-list" aria-live="polite"></div>
                <a class="inbox-all">View all notifications →</a>
              </section>
            </div>
            <button type="button" class="button secondary" id="play-signin" data-action="account">Sign In</button>
            <button type="button" class="wallet play-credits" data-action="activity" hidden><span class="coin" aria-hidden="true">✦</span><strong></strong><span>credits</span></button>
            <div class="account-anchor" hidden>
              <button type="button" class="avatar play-profile-button" aria-label="Open your account" aria-expanded="false" aria-controls="account-menu" data-action="account"></button>
              <div class="account-menu" id="account-menu" hidden>
                <button type="button" data-action="profile"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3"/><path d="M5 20v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2"/></svg>Profile</button>
                <button type="button" data-action="friends-open"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2m1-15a3 3 0 0 1 0 6m2 3a4 4 0 0 1 3 4v2"/></svg>Friends</button>
                <button type="button" data-action="account-activity"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-6 4 12 3-6h4"/></svg>Activity</button>
                <button type="button" data-action="play-history"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 1 2.6 6.4M3 6v6h6m3-5v5l3 2"/></svg>Play History</button>
                <button type="button" data-action="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16M8 4v4m8 2v4m-6 2v4"/></svg>Settings</button>
                <button type="button" data-action="play-console" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8 3v5c0 4.4-3.2 7.8-8 10-4.8-2.2-8-5.6-8-10V6z"/><path d="m8.5 11.5 2.5 2.5 4.5-5"/></svg>Play Host Console</button>
                <button type="button" data-action="donator-checkout" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.1 5.1 0 0 0-7.2 0L12 6.2l-1.6-1.6a5.1 5.1 0 0 0-7.2 7.2l1.6 1.6L12 20.6l7.2-7.2 1.6-1.6a5.1 5.1 0 0 0 0-7.2Z"/></svg>Donator Membership</button>
                <button type="button" data-action="logout"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H4v16h6m0-8h11m-4-4 4 4-4 4"/></svg>Sign Out</button>
              </div>
            </div>
          </div>
        </div>
      </header>
      <details class="play-live">
        <summary><strong>Live Matches <span id="live-count">—</span></strong><span id="live-counts">Loading activity…</span></summary>
        <div id="live-matches"></div>
      </details>
      <main id="main" tabindex="-1"><p class="loading">Loading Play…</p></main>
      <main id="play-watch" tabindex="-1" hidden></main>
      <footer class="play-footer"><span>AMQ Tours</span></footer>
    </div>
    <nav id="play-mobile-nav" aria-label="Mobile Navigation">
      <div id="play-mobile-primary"></div>
      <button id="play-mobile-more" type="button" aria-haspopup="dialog" aria-controls="play-mobile-menu" aria-expanded="false">
        <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16 M4 12h16 M4 18h16"/></svg><span>More</span>
      </button>
    </nav>
    <dialog id="play-mobile-menu" aria-labelledby="play-mobile-menu-title">
      <div class="play-menu-heading">
        <h2 id="play-mobile-menu-title">More</h2>
        <form method="dialog"><button type="submit" aria-label="Close menu">×</button></form>
      </div>
      <div class="play-menu-scroll">
        <nav id="play-mobile-links" aria-label="More Play Tabs"></nav>
        <a class="play-menu-gacha" href="/play/host" data-play-mode="host" data-host-page hidden>Host Console</a>
        <a class="play-menu-gacha" href="/gacha/">
          <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="5" width="12" height="15" rx="2"/><path d="M4 16V6a3 3 0 0 1 3-3m6 6 1.2 2.8L17 13l-2.8 1.2L13 17l-1.2-2.8L9 13l2.8-1.2Z"/></svg>
          Gacha <span aria-hidden="true">↗</span>
        </a>
      </div>
    </dialog>
    <dialog id="modal"><button type="button" class="dialog-close" aria-label="Close dialog">×</button><div id="modal-body"></div></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
